[workspace]
members = ["crates/twig-core", "crates/git-twig", "crates/twig-bench"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/leostera/git-twig"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
twig-core = { path = "crates/twig-core", version = "0.1.0" }

[profile.release]
lto = "thin"
strip = true
